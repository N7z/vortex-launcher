[package]
name = "vortex-launcher"
version = "2.1.0"
edition = "2021"
rust-version = "1.85"
description = "Unofficial native Linux launcher for Vortex"
license = "AGPL-3.0-or-later"
repository = "https://github.com/paulinho/vortex-launcher"

[lib]
name = "vortex_launcher"
path = "src/lib.rs"

[[bin]]
name = "vortex-launcher"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "vortex-launcher-cli"
path = "src/bin/cli.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:png", "dep:epaint_default_fonts"]

[dependencies]
eframe = { version = "0.35", optional = true, default-features = false, features = [
    "glow",
    "wayland",
    "x11",
] }
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sha2 = "0.11"
dirs = "6"
anyhow = "1"
png = { version = "0.18", optional = true }
epaint_default_fonts = { version = "0.35", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
