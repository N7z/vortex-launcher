[package]
name = "vortex-launcher"
version = "1.0.2"
edition = "2021"
rust-version = "1.85"
description = "Unofficial native Linux launcher for Vortex"
license = "AGPL-3.0-or-later"
repository = "https://github.com/paulinho/vortex-launcher"

[dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
] }
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sha2 = "0.11"
dirs = "6"
anyhow = "1"
png = "0.18"
epaint_default_fonts = "0.35"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
